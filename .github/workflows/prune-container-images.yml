name: "Prune Container Images"

on:
  workflow_call:
    inputs:
      prune-untagged:
        description: "Prune all untagged images"
        required: false
        type: boolean
        default: false
      tags-to-keep:
        description: "Comma-separated list of tags to keep (exact or regex)"
        required: false
        type: string
        default: "main,master,latest,nightly,develop,release*,nrk-release*,r*.*,r*.*.*,v*.*.*"
      dry-run:
        description: "Dry run"
        required: false
        type: boolean
        default: true
      keep-younger-than:
        description: "Keep tags younger than X days"
        required: false
        type: number
        default: 30
      keep-last:
        description: "Keep the last X tags"
        required: false
        type: string
        default: "15"
      package-name:
        description: "Name of the package (defaults to repo name)"
        required: false
        type: string
      runners:
        description: "Runner labels to use"
        required: false
        type: string
        default: "['ubuntu-latest']"
    secrets:
      prune-token:
        description: "Secret needed for GHCR access (Optional if you grant packages:write)"
        required: false

jobs:
  prune-container-images:
    runs-on: ${{ fromJson(inputs.runners) }}
    permissions:
      packages: write
    steps:
      - name: Prune container images (Tagged & Untagged)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.prune-token || github.token }}
          package: ${{ inputs.package-name || github.event.repository.name }}
          dry-run: ${{ inputs.dry-run }}
          delete-untagged: ${{ inputs.prune-untagged }}
          keep-n-tagged: ${{ inputs.keep-last }}
          older-than: ${{ inputs.keep-younger-than }} days
          exclude-tags: "${{ inputs.tags-to-keep }}"
          log-level: debug
